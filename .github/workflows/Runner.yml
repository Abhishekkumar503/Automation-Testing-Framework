name: Test Automation runner

on:
  schedule:
    - cron: '00 18 * * *'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Test
        run: |
          mvn test \
            -Dtest=com.ui.test.loginTestWithTestBased \
            -Dbrowser=chrome \
            -DisLambdaTest=true \
            -DisHeadless=true

      - name: Upload a logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation Logs
          path: logs/

      - name: Upload an Extent Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: Extend_Reports/

      - name: Upload an screenshot as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshots/


      - name: Test execution status
        run: echo "Execution Completed!"


      - name: Copy report to gh-pages folder
        if: always()

        run: |
         mkdir -p public/Extend_Reports/
         cp -R report.html public/Extend_Reports
         cp -R screenshots/public/Extend_Reports/screensots


      - name: Deploy
        if: always()
        uses: Jameslves/github-pages-deploy-action@v4
        with:
         folder: public/extend-reports/screenshots/
         token: ${github-pages}
         clean: true
      
         
       

       
      
